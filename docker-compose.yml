
services:
  kafka:
    image: confluentinc/cp-kafka:8.0.7
    container_name: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # Увеличено, так как Kafka долго инициализирует KRaft

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: gophprofile_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gophprofiledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile_user -d gophprofiledb && psql -U gophprofile_user -d gophprofiledb -c 'SELECT 1;'"]
      interval: 5s 
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"  
    environment:
      MINIO_ROOT_USER: gophprofile_user
      MINIO_ROOT_PASSWORD: supersecretpassword
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "13133:13133"
      - "8889:8889"
    command:
      - "--config=/etc/otel-collector-config.yml"
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro

    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel-collector-config.yml"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
 
  app-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: gophprofile-app:12.0.1  
    container_name: api-server
    command: ./gophprofile           
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=:8080
      - DATABASE_URI=postgres://gophprofile_user:secret@postgres:5432/gophprofiledb?sslmode=disable
      - MINIO_HOST=minio:9000
      - MINIO_ROOT_USER=gophprofile_user
      - MINIO_ROOT_PASSWORD=supersecretpassword
      - MINIO_SSL=false
      - KAFKA_BROKERS=kafka:9093
      - MIGRATIONS_PATH=file://migrations
      - OTEL_SERVICE_NAME=gophprofileservice
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: gophprofile-app:12.0.1  
    container_name: worker
    command: ./worker           
    environment:
      - SERVER_PORT=:8080
      - DATABASE_URI=postgres://gophprofile_user:secret@postgres:5432/gophprofiledb?sslmode=disable
      - MINIO_HOST=minio:9000
      - MINIO_ROOT_USER=gophprofile_user
      - MINIO_ROOT_PASSWORD=supersecretpassword
      - MINIO_SSL=false
      - KAFKA_BROKERS=kafka:9093
      - MIGRATIONS_PATH=file://migrations
      - OTEL_SERVICE_NAME=gophprofileservice
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app-server:
        condition: service_started

  loki:
    image: grafana/loki:main-0fd55b9
    container_name: loki
    command:
      - "-config.file=/etc/loki/local-config.yml"
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  nodeexporter:
    image: prom/node-exporter:v1.12.1
    container_name: nodeexporter
    ports:
      - '9100:9100' 

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    ports:
      - "16686:16686"
volumes:
  kafka_data:
  pg_data:
  minio_data:
  loki-data:
  grafana-data: