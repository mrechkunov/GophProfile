apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-server
  template:
    metadata:
      labels:
        app: app-server
    spec:
      # Ожидаем готовности БД и очередей перед стартом приложения
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka-broker 9093; do echo waiting for kafka; sleep 2; done;']
      
      containers:
      - name: api-server
        image: gophprofile-app:12.0.1
        imagePullPolicy: IfNotPresent
        command: ["./gophprofile"]
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: ":8080"
        - name: DATABASE_URI
          value: "postgres://gophprofile_user:secret@postgres:5432/gophprofiledb?sslmode=disable"
        - name: MINIO_HOST
          value: "minio:9000"
        - name: MINIO_ROOT_USER
          value: "gophprofile_user"
        - name: MINIO_ROOT_PASSWORD
          value: "supersecretpassword"
        - name: MINIO_SSL
          value: "false"
        - name: KAFKA_BROKERS
          value: "kafka-broker:9093"
        - name: MIGRATIONS_PATH
          value: "file://migrations"
        - name: OTEL_SERVICE_NAME
          value: "gophprofileservice"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits: { memory: "256Mi", cpu: "200m" }
---
apiVersion: v1
kind: Service
metadata:
  name: app-server
spec:
  selector:
    app: app-server
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: worker
        image: gophprofile-app:12.0.1
        imagePullPolicy: IfNotPresent
        command: ["./worker"]
        env:
        - name: SERVER_PORT
          value: ":8080"
        - name: DATABASE_URI
          value: "postgres://gophprofile_user:secret@postgres:5432/gophprofiledb?sslmode=disable"
        - name: MINIO_HOST
          value: "minio:9000"
        - name: MINIO_ROOT_USER
          value: "gophprofile_user"
        - name: MINIO_ROOT_PASSWORD
          value: "supersecretpassword"
        - name: MINIO_SSL
          value: "false"
        - name: KAFKA_BROKERS
          value: "kafka-broker:9093"
        - name: MIGRATIONS_PATH
          value: "file://migrations"
        - name: OTEL_SERVICE_NAME
          value: "gophprofileservice"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits: { memory: "256Mi", cpu: "200m" }
