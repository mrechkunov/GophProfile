{{- if .Values.observability.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "gophprofile.fullname" . }}-nodeexporter
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" . | nindent 6 }}
      component: nodeexporter
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" . | nindent 8 }}
        component: nodeexporter
    spec:
      hostNetwork: true # Дает прямой доступ к сетевым интерфейсам хоста
      hostPID: true     # Позволяет собирать метрики процессов хоста
      containers:
      - name: nodeexporter
        image: "{{ .Values.observability.nodeExporter.image }}"
        ports:
        - containerPort: 9100
          hostPort: 9100
          name: metrics
        resources:
          {{- toYaml .Values.observability.nodeExporter.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-nodeexporter
spec:
  selector:
    {{- include "gophprofile.selectorLabels" . | nindent 4 }}
    component: nodeexporter
  ports:
  - port: 9100
    targetPort: 9100
{{- end }}
