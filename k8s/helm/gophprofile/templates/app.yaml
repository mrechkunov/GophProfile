{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.fullname" . }}-app-server
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    component: app-server
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" . | nindent 6 }}
      component: app-server
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" . | nindent 8 }}
        component: app-server
    spec:
      containers:
      - name: api-server
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
        imagePullPolicy: {{ .Values.app.image.pullPolicy }}
        command: ["./gophprofile"]
        ports:
        - containerPort: {{ .Values.app.service.port }}
          name: http
        env:
        - name: SERVER_PORT
          value: ":{{ .Values.app.service.port }}"
        - name: DATABASE_URI
          value: "postgres://{{ .Values.postgres.env.user }}:{{ .Values.postgres.env.password }}@{{ include "gophprofile.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.env.db }}?sslmode=disable"
        - name: MINIO_HOST
          value: "{{ include "gophprofile.fullname" . }}-minio:{{ .Values.minio.service.apiPort }}"
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.env.rootUser | quote }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.minio.env.rootPassword | quote }}
        - name: MINIO_SSL
          value: "false"
        - name: KAFKA_BROKERS
          value: "{{ include "gophprofile.fullname" . }}-kafka:{{ .Values.kafka.service.internalPort }}"
        - name: MIGRATIONS_PATH
          value: "file://migrations"
        - name: OTEL_SERVICE_NAME
          value: "gophprofileservice"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://{{ include "gophprofile.fullname" . }}-otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        resources:
          {{- toYaml .Values.app.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-app-server
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    component: app-server
spec:
  type: NodePort
  selector:
    {{- include "gophprofile.selectorLabels" . | nindent 4 }}
    component: app-server
  ports:
  - port: {{ .Values.app.service.port }}
    targetPort: {{ .Values.app.service.port }}
    nodePort: {{ .Values.app.service.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.fullname" . }}-worker
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" . | nindent 6 }}
      component: worker
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" . | nindent 8 }}
        component: worker
    spec:
      containers:
      - name: worker
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
        imagePullPolicy: {{ .Values.app.image.pullPolicy }}
        command: ["./worker"]
        env:
        - name: SERVER_PORT
          value: ":{{ .Values.app.service.port }}"
        - name: DATABASE_URI
          value: "postgres://{{ .Values.postgres.env.user }}:{{ .Values.postgres.env.password }}@{{ include "gophprofile.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.env.db }}?sslmode=disable"
        - name: MINIO_HOST
          value: "{{ include "gophprofile.fullname" . }}-minio:{{ .Values.minio.service.apiPort }}"
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.env.rootUser | quote }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.minio.env.rootPassword | quote }}
        - name: MINIO_SSL
          value: "false"
        - name: KAFKA_BROKERS
          value: "{{ include "gophprofile.fullname" . }}-kafka:{{ .Values.kafka.service.internalPort }}"
        - name: MIGRATIONS_PATH
          value: "file://migrations"
        - name: OTEL_SERVICE_NAME
          value: "gophprofileservice-worker"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=development"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://{{ include "gophprofile.fullname" . }}-otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        resources:
          {{- toYaml .Values.app.resources | nindent 10 }}
{{- end }}
